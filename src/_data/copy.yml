    privacy:
      title: Privacy – Koivupiilo
      description: "Koivupiilo's privacy notice: what data it handles on the site, by email and for Ratametsuri beta applications, how long it keeps it, and what your rights are."
      heading: Privacy
      lede: Koivupiilo handles your data when you visit the site, email it or apply for the Ratametsuri beta.
      sections:
        - heading: Cookies and visitor counts
          text:
            - Koivupiilo uses cookies and browser storage for what the pages need to work. It doesn't use them for advertising or for tracking visitors without your permission.
            - Koivupiilo counts total page visits and beta applications to see how the pages are used. It runs the counter itself, without cookies, and the counter doesn't store your IP address. The totals don't show who visited.
        - heading: Servers
          text:
            - Your IP address reaches the servers whenever your browser fetches a page. The service providers may use it to protect their services. Koivupiilo uses it to stop abuse of its forms and keeps it for no more than an hour. The basis is a legitimate interest in protecting the site.
        - heading: Email
          text:
            - When you write to Koivupiilo, it uses your address and your message only to reply. The basis is a legitimate interest in answering. Your message is kept until you ask for it to be deleted.
      sections_after:
        - heading: Who handles the data
          text:
            - The service providers that run the servers and email handle data on Koivupiilo's behalf. The data isn't sold or passed on to anyone else.
            - Some of the providers operate outside the EU. Transfers to them rely on safeguards approved by the European Commission.
        - heading: Your rights
          text:
            - You can ask to see the data Koivupiilo holds about you, and to get it as a file. You can ask for it to be deleted, and object to the use of your survey answers. You can withdraw your consent at any time. Write to %{email}.
            - If you think your data has been handled wrongly, you can complain to the Finnish Data Protection Ombudsman.
      controller_heading: Controller
      updated: Updated %{date}.
