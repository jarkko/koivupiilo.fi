    privacy:
      title: Tietosuoja – Koivupiilo
      description: Mitä tietoja Koivupiilo käsittelee sivustolla, sähköpostissa ja Ratametsurin betahaussa, kuinka kauan niitä säilytetään ja mitä oikeuksia sinulla on.
      heading: Tietosuoja
      lede: Kun käyt sivustolla, lähetät sähköpostia tai haet Ratametsurin betaan, Koivupiilo käsittelee tietojasi. Tällä sivulla kerrotaan, mitä tietoja ja miksi.
      sections:
        - heading: Evästeet ja kävijämäärät
          text:
            - Sivustolla käytetään evästeitä ja selaimen tallennustilaa, jotta sivut toimivat. Niitä ei käytetä mainontaan eikä seurantaan ilman lupaasi.
            - Koivupiilo laskee käynnit ja betahakemukset nähdäkseen, miten sivuja käytetään. Laskuri on Koivupiilon oma. Se toimii ilman evästeitä eikä tallenna IP-osoitettasi. Luvuista ei näe, kuka sivuilla on käynyt.
        - heading: Palvelimet
          text:
            - Kun selaimesi hakee sivun, IP-osoitteesi välittyy palvelimelle. Palvelimista vastaava palveluntarjoaja voi käyttää osoitetta palvelunsa suojaamiseen. Koivupiilo käyttää osoitetta estääkseen lomakkeiden väärinkäytön ja säilyttää sitä enintään tunnin. Käsittely perustuu oikeutettuun etuun eli sivuston suojaamiseen.
        - heading: Sähköposti
          text:
            - Kun lähetät Koivupiilolle sähköpostia, osoitettasi ja viestiäsi käytetään vain vastaamiseen. Viesti säilytetään, kunnes pyydät poistamaan sen. Käsittely perustuu oikeutettuun etuun eli yhteydenottoihin vastaamiseen.
      sections_after:
        - heading: Kuka tietoja käsittelee
          text:
            - Palvelimista ja sähköpostista huolehtivat palveluntarjoajat, jotka käsittelevät tietoja Koivupiilon lukuun. Tietoja ei myydä eikä luovuteta muille.
            - Osa palveluntarjoajista toimii EU:n ulkopuolella. Tietojen siirto niille perustuu Euroopan komission hyväksymiin suojatoimiin.
        - heading: Oikeutesi
          text:
            - Voit pyytää nähtäväksesi sinusta tallennetut tiedot ja saada ne tiedostona. Voit myös pyytää niiden poistamista ja vastustaa kyselyvastaustesi käyttöä. Voit perua suostumuksesi milloin tahansa. Lähetä pyyntö osoitteeseen %{email}.
            - Jos katsot, että tietojasi on käsitelty väärin, voit tehdä valituksen tietosuojavaltuutetun toimistolle.
      controller_heading: Rekisterinpitäjä
      updated: Päivitetty %{date}.
