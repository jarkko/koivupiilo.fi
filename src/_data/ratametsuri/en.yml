features:
  - title: "See what a click will do before you click"
    text: "Next to the pointer you read, for example, “Add 31 as 4” or “Insert between 2 and 3”. If you hit a control that's already on the course, the click selects it and doesn't add it again."
  - title: "Courses straight to your results software"
    text: "MeOS reads them as they are."
  - title: "The control descriptions place themselves on the map"
    text: "If they don't fit the page in one column, a second one goes beside it. They're on the map in the course PDF too."

