requirements:
  heading: "Mitä tarvitset"
  items:
    - "Mac, jossa on macOS 14 Sonoma tai uudempi"
    - "Kartta PDF- tai kuvatiedostona"

features_heading: "Mitä Ratametsuri osaa jo"
features:
  - title: "Rasti menee sinne, minne tarkoitit"
    text: "Kun lisäät rasteja, osoittimen vieressä lukee etukäteen, mitä napsautus tekee: esimerkiksi ”Lisää 31 rastiksi 4” tai ”Lisää rastien 2 ja 3 väliin”. Jos osut rastiin, joka on jo radalla, napsautus vain valitsee sen eikä lisää sitä vahingossa toista kertaa."
  - title: "Rastinmääritteet asettuvat kartalle itsestään"
    text: "Jos rasteja on paljon, määritteet jatkuvat toiseen palstaan. Jokaisesta radasta saat oman PDF:n, jossa määritteet ovat kartalla."
  - title: "Radat siirtyvät MeOSiin sellaisinaan"
    text: "Viet radat IOF XML -tiedostona, ja MeOS lukee ne suoraan. Tulospalvelussa ei tarvitse tehdä mitään toisin."

