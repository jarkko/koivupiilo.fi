<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Jumbo Volley: illustration of a big-screen scoreboard with example data</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10141f"/><stop offset="1" stop-color="#1b2233"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1f2a44"/><stop offset="1" stop-color="#2a3658"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <!-- screen frame -->
  <rect x="120" y="110" width="1360" height="640" rx="18" fill="#0b0e16" stroke="#3a4560" stroke-width="4"/>
  <!-- scoreboard -->
  <g transform="translate(220 230)">
    <rect width="1160" height="150" rx="10" fill="url(#bar)"/>
    <rect x="0" y="0" width="16" height="150" rx="4" fill="#ffd23f"/>
    <text x="56" y="96" fill="#fff" font-size="64" font-weight="800" letter-spacing="2">KOTI</text>
    <text x="560" y="98" fill="#ffd23f" font-size="72" font-weight="800" text-anchor="end">2</text>
    <rect x="600" y="28" width="150" height="94" rx="8" fill="#0b0e16"/>
    <text x="675" y="100" fill="#fff" font-size="76" font-weight="800" text-anchor="middle">21</text>
    <rect x="0" y="170" width="1160" height="150" rx="10" fill="url(#bar)"/>
    <rect x="0" y="170" width="16" height="150" rx="4" fill="#7fb3ff"/>
    <text x="56" y="266" fill="#fff" font-size="64" font-weight="800" letter-spacing="2">VIERAS</text>
    <text x="560" y="268" fill="#ffd23f" font-size="72" font-weight="800" text-anchor="end">1</text>
    <rect x="600" y="198" width="150" height="94" rx="8" fill="#0b0e16"/>
    <text x="675" y="270" fill="#fff" font-size="76" font-weight="800" text-anchor="middle">18</text>
    <g fill="#9aa6c2" font-size="30" font-weight="600">
      <text x="800" y="70">ERÄT</text>
      <text x="800" y="112">25–20 · 22–25 · 25–19</text>
      <text x="800" y="240">4. ERÄ</text>
      <text x="800" y="282">Aikalisä: koti 1, vieras 0</text>
    </g>
  </g>
  <text x="220" y="660" fill="#6f7a96" font-size="28" font-weight="600">Esimerkkidata · example data</text>
  <!-- phone remote -->
  <g transform="translate(1180 520)">
    <rect width="230" height="440" rx="34" fill="#232a3c" stroke="#55607e" stroke-width="4"/>
    <rect x="16" y="40" width="198" height="360" rx="16" fill="#0f1320"/>
    <rect x="34" y="70" width="162" height="64" rx="10" fill="#ffd23f"/>
    <text x="115" y="112" fill="#10141f" font-size="26" font-weight="800" text-anchor="middle">Tulos</text>
    <rect x="34" y="150" width="162" height="64" rx="10" fill="#2a3658"/>
    <text x="115" y="192" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">Aikalisä</text>
    <rect x="34" y="230" width="162" height="64" rx="10" fill="#2a3658"/>
    <text x="115" y="272" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">Kokoonpano</text>
    <rect x="34" y="310" width="162" height="64" rx="10" fill="#2a3658"/>
    <text x="115" y="352" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">Mainos</text>
  </g>
</svg>
